[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoetrope"
version = "0.1.0"
description = "Record when an inference host did each thing, then draw it as a film"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["inference", "profiling", "visualization", "explainer", "video"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy", "pillow", "imageio-ffmpeg"]

[project.optional-dependencies]
# the recorders need whatever host they are recording; nothing is pinned here
# because a recorder runs inside an environment that already has it
robot = ["torch"]

[project.scripts]
zoetrope = "zoetrope.cli:main"

[tool.setuptools.packages.find]
include = ["zoetrope*"]

# the authored layouts and explainer specs are data the painters load at
# runtime, so they have to travel with the wheel
[tool.setuptools.package-data]
zoetrope = ["diagrams/*.json", "explainers/*.json"]
